<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0c">
<title>Calendario de basura</title>
<style>
  :root {
    --bg: #0a0a0c;
    --card: #151518;
    --panel: #1c1c20;
    --field: #121215;
    --line: #2a2a30;
    --text: #f4f4f6;
    --muted: #9b9ba5;
    --box: #5b5b65;
    --blue: #4da3ff;
    --blue-bg: rgba(77, 163, 255, .12);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app { max-width: 680px; margin: 0 auto; padding: 28px 16px 0; }
  h1 { font-size: 1.7rem; letter-spacing: -.02em; }
  .sub, .range { color: var(--muted); font-size: .9rem; }
  .sub { margin-top: 4px; }
  .range { margin: 18px 0 12px; }
  .warn { margin-top: 16px; padding: 12px 14px; font-size: .9rem; color: #e6c768; background: var(--panel); border: 1px solid #6b5a22; border-radius: 12px; }

  #list { display: grid; gap: 16px; }
  .week { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .week.now { border-color: #50505a; }
  .week-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 { font-size: 1rem; font-weight: 600; }
  .tag { font-size: .72rem; background: #2a2a30; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .roles { margin-top: 14px; }
  .label { color: var(--muted); font-size: .85rem; }
  .owner { font-size: 1.6rem; font-weight: 700; letter-spacing: .05em; }

  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 12px; }
  .day-top { display: flex; justify-content: space-between; align-items: baseline; }
  h3 { font-size: 1.05rem; }
  .day-top span, .who { color: var(--muted); font-size: .9rem; }
  .task { margin-top: 10px; }
  .task + .task { padding-top: 12px; border-top: 1px solid var(--line); }
  .kind { font-size: .95rem; font-weight: 600; }
  .who b { color: var(--text); letter-spacing: .04em; }

  /* Checkboxes personalizados */
  .checks { display: grid; gap: 8px; margin-top: 10px; }
  .check { position: relative; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .pill {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px;
    background: var(--field); border: 1.5px solid var(--line); border-radius: 12px;
    color: var(--muted); user-select: none; transition: .15s;
  }
  .box { position: relative; flex: none; width: 20px; height: 20px; border: 2px solid var(--box); border-radius: 6px; transition: .15s; }
  .box::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid var(--blue); border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0); transition: transform .15s;
  }
  .check input:checked + .pill { color: var(--blue); border-color: var(--blue); background: var(--blue-bg); }
  .check input:checked + .pill .box { border-color: var(--blue); }
  .check input:checked + .pill .box::after { transform: rotate(45deg) scale(1); }
  .check input:focus-visible + .pill { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Navegación */
  .nav {
    position: sticky; bottom: 0; display: flex; gap: 8px; margin: 16px -16px 0; padding: 12px 16px;
    background: rgba(10, 10, 12, .95); border-top: 1px solid var(--line);
  }
  .nav button {
    flex: 1; padding: 13px 8px; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .nav button:hover:not(:disabled) { border-color: var(--box); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  @media (min-width: 900px) {
    .app { max-width: 980px; }
    #list { grid-template-columns: 1fr 1fr; align-items: start; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Calendario de basura</h1>
    <p class="sub" id="sub"></p>
  </header>
  <p class="warn" id="warn" hidden>Este navegador bloquea el guardado local (modo privado o vista previa). Abre la página en una pestaña normal para que las casillas se guarden.</p>
  <p class="range" id="range"></p>
  <section id="list"></section>
  <nav class="nav" aria-label="Navegación entre semanas">
    <button id="next" type="button">Siguiente</button>
  </nav>
</main>

<script>
(() => {
  "use strict";

  /* ========== CONFIGURACIÓN: edita solo esta parte ========== */
  const NAMES = ["MIGUEL", "ADONIS", "VALERIA", "KEYLA"]; // orden de la rotación semanal de la basura
  const START_DATE = "2026-10-05";   // lunes de la semana 1 (le toca al primer nombre)
  const END_DATE = "2030-12-31";     // último día del calendario
  const DEADLINE = "11:00 a.m.";

  const DAY_NAMES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const TRASH_TASKS = {              // día de la semana (0 = lunes) -> casillas [id, texto]
    0: [["sacada", "Basura sacada"]],
    3: [["sacada", "Basura sacada"], ["reciclaje", "Reciclaje sacado"], ["lavado", "Basurero lavado"]]
  };
  // Limpieza de abajo, día por medio: una persona distinta por día, siempre las que NO sacan la basura esa semana.
  // El orden rota cada semana (necesita menos días de limpieza que nombres).
  const CLEAN_DAYS = [0, 2, 4];      // lunes, miércoles y viernes
  const CLEAN_TASK = ["limpieza", "Barrer y limpiar"];

  // Textos especiales: en las semanas indicadas (lunes de cada una) el nombre se muestra con otro texto
  const SPECIAL = [
    { weeks: ["2026-10-05", "2026-10-12"], name: "VALERIA", text: "VALERIA - ESTA SEMANA NO PORQUE ESTA TRISTE" }
  ];

  const WEEKS_PER_STEP = 2;          // semanas visibles al inicio y cada vez que se pulsa "Siguiente"
  const STORAGE_KEY = "calendario-basura-v1";
  /* ========================================================== */

  /* ---------- Fechas (días enteros, sin problemas de horario de verano) ---------- */
  const DAY = 864e5;
  const toNum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / DAY; };
  const toISO = n => new Date(n * DAY).toISOString().slice(0, 10);
  const fmt = n => toISO(n).split("-").reverse().join("/");
  const todayNum = () => { const t = new Date(); return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const n0 = toNum(START_DATE);
  const START = n0 - ((n0 + 3) % 7);            // se ajusta al lunes de esa semana
  const END = toNum(END_DATE);
  const LAST = Math.floor((END - START) / 7);   // índice de la última semana
  const OFFSETS = [...new Set([...Object.keys(TRASH_TASKS).map(Number), ...CLEAN_DAYS])].sort((a, b) => a - b);

  /* Cada semana se calcula solo cuando se necesita (no se guarda el calendario completo) */
  const weekAt = i => {
    const mon = START + 7 * i;
    return {
      start: mon,
      end: mon + 6,
      trash: NAMES[i % NAMES.length],
      clean: CLEAN_DAYS.map((_, j) => NAMES[(i + 1 + j) % NAMES.length]),
      days: OFFSETS.map(o => mon + o).filter(d => d <= END)
    };
  };

  /* ---------- Almacenamiento ----------
     1) Vista previa de Claude: usa su almacenamiento (ahí localStorage está bloqueado).
     2) GitHub Pages o archivo abierto en el navegador: usa localStorage.
     3) Si nada está disponible (modo privado, etc.), se muestra un aviso en pantalla. */
  const hasHost = !!(window.storage && typeof window.storage.get === "function");
  const hasLocal = !hasHost && (() => {
    try { localStorage.setItem("__test", "1"); localStorage.removeItem("__test"); return true; }
    catch (e) { return false; }
  })();
  let saved = {};
  let queue = Promise.resolve();

  const store = {
    ok: hasHost || hasLocal,
    async read() {
      try {
        if (hasHost) return JSON.parse((await window.storage.get(STORAGE_KEY, false)).value) || {};
        if (hasLocal) return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {}
      return {};
    },
    write() {
      if (hasHost) {
        queue = queue.then(() => window.storage.set(STORAGE_KEY, JSON.stringify(saved), false)).catch(() => {});
      } else if (hasLocal) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
      }
    }
  };

  /* ---------- Vistas ---------- */
  const check = (key, text) =>
    `<label class="check"><input type="checkbox" data-key="${key}"${saved[key] ? " checked" : ""}>` +
    `<span class="pill"><span class="box"></span>${text}</span></label>`;

  /* Nombre a mostrar (con el texto especial si corresponde a esa semana) */
  const shownName = (name, mon) => {
    const s = SPECIAL.find(x => x.name === name && x.weeks.includes(toISO(mon)));
    return esc(s ? s.text : name);
  };

  const task = (kind, owner, boxes, date) => `
    <div class="task">
      <p class="kind">${kind}</p>
      <p class="who">Responsable: <b>${owner}</b></p>
      <div class="checks">${boxes.map(([id, text]) => check(`${toISO(date)}:${id}`, text)).join("")}</div>
    </div>`;

  const day = (d, w) => {
    const o = d - w.start;
    return `
      <section class="day">
        <div class="day-top"><h3>${DAY_NAMES[o]}</h3><span>${fmt(d)}</span></div>
        ${TRASH_TASKS[o] ? task(`Basura, antes de las ${DEADLINE}`, shownName(w.trash, w.start), TRASH_TASKS[o], d) : ""}
        ${CLEAN_DAYS.includes(o) ? task("Limpieza de abajo", shownName(w.clean[CLEAN_DAYS.indexOf(o)], w.start), [CLEAN_TASK], d) : ""}
      </section>`;
  };

  const card = (w, today) => {
    const now = today >= w.start && today <= w.end;
    return `
      <article class="week${now ? " now" : ""}">
        <div class="week-top">
          <h2>Semana del ${fmt(w.start)} al ${fmt(w.end)}</h2>
          ${now ? '<span class="tag">Semana actual</span>' : ""}
        </div>
        <div class="roles">
          <p class="label">Responsable de basura:</p>
          <p class="owner">${shownName(w.trash, w.start)}</p>
        </div>
        ${w.days.map(d => day(d, w)).join("")}
      </article>`;
  };

  /* ---------- Navegación: solo hacia adelante; las semanas pasadas se eliminan ---------- */
  const $ = id => document.getElementById(id);
  const list = $("list"), range = $("range"), next = $("next");
  let first = 0, shown = WEEKS_PER_STEP;

  function render() {
    const today = todayNum();
    const last = Math.min(first + shown - 1, LAST);
    let html = "";
    for (let i = first; i <= last; i++) html += card(weekAt(i), today);
    list.innerHTML = html;
    range.textContent = `Mostrando del ${fmt(START + 7 * first)} al ${fmt(START + 7 * last + 6)}`;
    next.disabled = last >= LAST;
  }

  /* Calcula la semana actual, borra lo guardado de semanas pasadas y dibuja */
  function refresh() {
    first = Math.min(LAST, Math.max(0, Math.floor((todayNum() - START) / 7)));
    const cutoff = toISO(START + 7 * first);
    let dirty = false;
    for (const k in saved) if (k.slice(0, 10) < cutoff) { delete saved[k]; dirty = true; }
    if (dirty) store.write();
    render();
  }

  next.onclick = () => {
    const before = list.children.length;
    shown += WEEKS_PER_STEP;
    render();
    if (list.children[before]) list.children[before].scrollIntoView({ behavior: "smooth", block: "start" });
  };

  /* Guardar cada checkbox al instante */
  list.addEventListener("change", e => {
    const key = e.target.dataset.key;
    if (!key) return;
    if (e.target.checked) saved[key] = 1; else delete saved[key];
    store.write();
  });

  /* Cargar lo guardado, sincronizar entre pestañas y actualizar al volver a la página */
  const sync = () => store.read().then(d => { saved = d; refresh(); });
  window.addEventListener("storage", e => { if (e.key === STORAGE_KEY) sync(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  const trashDays = Object.keys(TRASH_TASKS).map(o => DAY_NAMES[o]).join(" y ");
  $("sub").textContent = `Basura: ${trashDays}, antes de las ${DEADLINE}`;
  $("warn").hidden = store.ok;
  refresh();  // muestra el calendario enseguida
  sync();     // y aplica las casillas guardadas
})();
</script>
</body>
</html>
