<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de basura</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f5f5f5;
      padding: 20px;
      padding-bottom: 100px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .semana {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
      scroll-margin-top: 20px;
    }

    .semana h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .aviso {
      background: #2b2020;
      border: 1px solid #633;
      color: #ffd5d5;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .dia {
      border-top: 1px solid #2d2d2d;
      padding: 14px 0;
    }

    .dia:first-of-type {
      border-top: none;
      padding-top: 4px;
    }

    .dia-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .dia-nombre {
      font-weight: bold;
      font-size: 16px;
    }

    .encargado {
      font-size: 13px;
      color: #aaa;
      text-align: right;
    }

    .tarea {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 8px 0;
      cursor: pointer;
      user-select: none;
    }

    .tarea input {
      display: none;
    }

    .check {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid #777;
      border-radius: 6px;
      position: relative;
      transition: 0.15s ease;
      background: #151515;
    }

    .tarea input:checked + .check {
      background: #4caf50;
      border-color: #4caf50;
    }

    .tarea input:checked + .check::after {
      content: "✓";
      position: absolute;
      left: 3px;
      top: -2px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .texto-tarea {
      font-size: 15px;
      line-height: 1.3;
    }

    .tarea input:checked ~ .texto-tarea {
      text-decoration: line-through;
      color: #777;
    }

    .boton-siguiente {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(88%, 430px);
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);
      z-index: 100;
    }

    .boton-siguiente:active {
      transform: translateX(-50%) scale(0.98);
    }

    .estado {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 15px;
    }

    @media (min-width: 800px) {
      .container {
        max-width: 980px;
      }

      .semana {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Calendario de basura</h1>

    <div class="subtitulo">
      Cada persona marca su tarea cuando ya la realizó.
    </div>

    <div id="calendario"></div>

    <div class="estado" id="estado">
      Conectando...
    </div>

  </div>

  <button class="boton-siguiente" id="btnSiguiente">
    Siguiente
  </button>

  <script type="module">

    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL = "https://irlgbidgxlbtocwrdmkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_S7aoT2t9KrmjqMnhvwhGkw_RHxJ8kMX";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================================================
       CONFIGURACIÓN ORIGINAL
       ========================================================= */

    const NAMES = [
      "MIGUEL",
      "ADONIS",
      "VALERIA",
      "KEYLA"
    ];

    const START_DATE = "2026-10-05";
    const END_DATE = "2030-12-31";

    const DEADLINE = "11:00 a.m.";

    const DAY_NAMES = [
      "Lunes",
      "Martes",
      "Miércoles",
      "Jueves",
      "Viernes",
      "Sábado",
      "Domingo"
    ];

    const TRASH_TASKS = {
      0: [
        ["sacada", "Basura sacada"]
      ],

      3: [
        ["sacada", "Basura sacada"],
        ["reciclaje", "Reciclaje sacado"],
        ["lavado", "Basurero lavado"]
      ]
    };

    const CLEAN_DAYS = [
      0,
      2,
      4
    ];

    const CLEAN_TASK = [
      "limpieza",
      "Barrer y limpiar"
    ];

    const SPECIAL = {
      weeks: [
        "2026-10-05",
        "2026-10-12"
      ],
      name: "VALERIA",
      text: "VALERIA - ESTA SEMANA NO PORQUE ESTA TRISTE"
    };

    const WEEKS_PER_STEP = 2;


    /* =========================================================
       VARIABLES
       ========================================================= */

    const calendario = document.getElementById("calendario");
    const estado = document.getElementById("estado");
    const btnSiguiente = document.getElementById("btnSiguiente");

    let semanas = [];
    let semanaActual = 0;

    let marcadas = new Set();


    /* =========================================================
       FECHAS
       ========================================================= */

    function fechaLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function crearFecha(fecha) {
      const [y, m, d] = fecha.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function sumarDias(date, cantidad) {
      const nueva = new Date(date);
      nueva.setDate(nueva.getDate() + cantidad);
      return nueva;
    }

    function formatearFecha(date) {
      return date.toLocaleDateString("es-CR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }


    /* =========================================================
       GENERAR SEMANAS
       ========================================================= */

    function generarSemanas() {

      semanas = [];

      let inicio = crearFecha(START_DATE);
      const final = crearFecha(END_DATE);

      let indiceSemana = 0;

      while (inicio <= final) {

        const fin = sumarDias(inicio, 6);

        semanas.push({
          inicio: new Date(inicio),
          fin: new Date(fin),
          indice: indiceSemana
        });

        inicio = sumarDias(inicio, 7);
        indiceSemana++;
      }
    }


    /* =========================================================
       ENCARGADOS
       ========================================================= */

    function obtenerEncargadoBasura(indice) {

      const fecha = fechaLocal(
        semanas[indice].inicio
      );

      const especial = SPECIAL.weeks.includes(fecha);

      if (especial) {
        return SPECIAL.name;
      }

      return NAMES[indice % NAMES.length];
    }

    function obtenerEncargadoLimpieza(indice, posicion) {

      return NAMES[
        (indice + 1 + posicion) % NAMES.length
      ];
    }


    /* =========================================================
       CLAVES ÚNICAS
       ========================================================= */

    function crearClave(fecha, tipo, tarea) {

      return `${fecha}|${tipo}|${tarea}`;
    }


    /* =========================================================
       CARGAR DATOS DESDE SUPABASE
       ========================================================= */

    async function cargarMarcadas() {

      estado.textContent = "Sincronizando...";

      const { data, error } = await supabase
        .from("calendario_basura")
        .select("clave, marcada");

      if (error) {

        console.error(error);

        estado.textContent =
          "Error de conexión con la base de datos.";

        return;
      }

      marcadas = new Set(
        (data || [])
          .filter(item => item.marcada === true)
          .map(item => item.clave)
      );

      estado.textContent =
        "Sincronizado ✓";

      actualizarCheckboxes();
    }


    /* =========================================================
       GUARDAR CAMBIO
       ========================================================= */

    async function cambiarEstado(clave, marcada) {

      if (marcada) {

        marcadas.add(clave);

        const { error } = await supabase
          .from("calendario_basura")
          .upsert(
            {
              clave: clave,
              marcada: true
            },
            {
              onConflict: "clave"
            }
          );

        if (error) {

          console.error(error);

          marcadas.delete(clave);

          actualizarCheckboxes();

          alert(
            "No se pudo guardar el cambio."
          );

          return;
        }

      } else {

        marcadas.delete(clave);

        const { error } = await supabase
          .from("calendario_basura")
          .delete()
          .eq("clave", clave);

        if (error) {

          console.error(error);

          marcadas.add(clave);

          actualizarCheckboxes();

          alert(
            "No se pudo guardar el cambio."
          );

          return;
        }
      }

      estado.textContent =
        "Guardado ✓";
    }


    /* =========================================================
       ACTUALIZAR CHECKBOXES
       ========================================================= */

    function actualizarCheckboxes() {

      document
        .querySelectorAll("input[data-clave]")
        .forEach(input => {

          const clave = input.dataset.clave;

          input.checked =
            marcadas.has(clave);
        });
    }


    /* =========================================================
       CREAR TAREA
       ========================================================= */

    function crearTarea(
      fecha,
      tipo,
      tareaId,
      texto
    ) {

      const clave =
        crearClave(
          fecha,
          tipo,
          tareaId
        );

      const label =
        document.createElement("label");

      label.className = "tarea";

      label.innerHTML = `
        <input
          type="checkbox"
          data-clave="${clave}"
        >
        <span class="check"></span>
        <span class="texto-tarea">${texto}</span>
      `;

      const input =
        label.querySelector("input");

      input.checked =
        marcadas.has(clave);

      input.addEventListener(
        "change",
        () => {

          cambiarEstado(
            clave,
            input.checked
          );

        }
      );

      return label;
    }


    /* =========================================================
       MOSTRAR CALENDARIO
       ========================================================= */

    function renderCalendario() {

      calendario.innerHTML = "";

      semanas.forEach(
        (semana, indice) => {

          const semanaDiv =
            document.createElement("section");

          semanaDiv.className = "semana";

          semanaDiv.dataset.indice =
            indice;

          semanaDiv.id =
            `semana-${indice}`;

          const fechaInicio =
            fechaLocal(
              semana.inicio
            );

          const especial =
            SPECIAL.weeks.includes(
              fechaInicio
            );

          semanaDiv.innerHTML = `
            <h2>
              Semana del
              ${formatearFecha(semana.inicio)}
              al
              ${formatearFecha(semana.fin)}
            </h2>
          `;


          /* =============================
             AVISO ESPECIAL
             ============================= */

          if (especial) {

            const aviso =
              document.createElement("div");

            aviso.className =
              "aviso";

            aviso.textContent =
              SPECIAL.text;

            semanaDiv.appendChild(aviso);
          }


          /* =============================
             DÍAS
             ============================= */

          for (
            let dia = 0;
            dia < 7;
            dia++
          ) {

            const fecha =
              sumarDias(
                semana.inicio,
                dia
              );

            const fechaTexto =
              fechaLocal(fecha);

            const diaDiv =
              document.createElement("div");

            diaDiv.className =
              "dia";

            const titulo =
              document.createElement("div");

            titulo.className =
              "dia-titulo";

            titulo.innerHTML = `
              <div class="dia-nombre">
                ${DAY_NAMES[dia]}
              </div>

              <div class="encargado">
                Hasta ${DEADLINE}
              </div>
            `;

            diaDiv.appendChild(titulo);


            /* =============================
               BASURA
               ============================= */

            if (TRASH_TASKS[dia]) {

              const encargado =
                obtenerEncargadoBasura(
                  indice
                );

              titulo.querySelector(
                ".encargado"
              ).textContent =
                encargado;

              TRASH_TASKS[dia]
                .forEach(
                  ([taskId, texto]) => {

                    diaDiv.appendChild(
                      crearTarea(
                        fechaTexto,
                        "basura",
                        taskId,
                        `${texto} — ${encargado}`
                      )
                    );

                  }
                );
            }


            /* =============================
               LIMPIEZA
               ============================= */

            if (
              CLEAN_DAYS.includes(dia)
            ) {

              const posicion =
                CLEAN_DAYS.indexOf(dia);

              const encargado =
                obtenerEncargadoLimpieza(
                  indice,
                  posicion
                );

              diaDiv.appendChild(
                crearTarea(
                  fechaTexto,
                  "limpieza",
                  CLEAN_TASK[0],
                  `${CLEAN_TASK[1]} — ${encargado}`
                )
              );
            }


            /* Solo agregar días
               que tengan tareas */

            if (
              diaDiv.querySelector(
                "input"
              )
            ) {

              semanaDiv.appendChild(
                diaDiv
              );
            }

          }


          calendario.appendChild(
            semanaDiv
          );

        }
      );

      actualizarCheckboxes();
    }


    /* =========================================================
       BOTÓN SIGUIENTE
       ========================================================= */

    btnSiguiente.addEventListener(
      "click",
      () => {

        semanaActual += WEEKS_PER_STEP;

        if (
          semanaActual >= semanas.length
        ) {

          semanaActual = 0;
        }

        const destino =
          document.getElementById(
            `semana-${semanaActual}`
          );

        if (destino) {

          destino.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }

      }
    );


    /* =========================================================
       SINCRONIZACIÓN AUTOMÁTICA
       ========================================================= */

    setInterval(
      async () => {

        await cargarMarcadas();

      },
      2000
    );


    /* =========================================================
       INICIAR
       ========================================================= */

    generarSemanas();

    renderCalendario();

    cargarMarcadas();

  </script>

</body>
</html>
